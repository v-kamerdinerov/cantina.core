---
# Deploy SSH public key(s) to authorized_keys. Optional: no-op when
# common_ssh_public_key is empty.
- name: "Common | SSH Keys | Add public key(s) to authorized_keys"
  ansible.posix.authorized_key:
    user: "{{ ansible_user_id }}"
    key: "{{ common_ssh_public_key }}"
    state: present
  when: common_ssh_public_key | default('') | length > 0
  tags: ssh_keys
