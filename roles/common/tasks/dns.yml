---
# Install systemd-resolved
- name: "DNS | Install systemd-resolved"
  ansible.builtin.package:
    name: "systemd-resolved"
    state: present
  tags: dns

# Configure systemd-resolved to listen on both DoT and DoH
- name: "DNS | Set resolved.conf configuration"
  ansible.builtin.template:
    src: "templates/resolved.conf.j2"
    dest: "/etc/systemd/resolved.conf"
    mode: '0644'
    owner: root
    group: root
    backup: true
    validate_command: systemd-analyze verify /etc/systemd/resolved.conf
  notify: Restart systemd-resolved
  tags: dns

# Configure DNS stub listener to listen on DoT port 853
- name: "DNS | Configure DoT port 853"
  ansible.builtin.lineinfile:
    path: "/etc/systemd/resolved.conf"
    regexp: "^ListenStub="
    line: "ListenStub=127.0.0.53:53 127.0.0.53:853"
  notify: Restart systemd-resolved
  when: common_dns_listen_ports | default([53]) | length > 1
  tags: dns

# Configure DNS-over-TLS external servers
- name: "DNS | Set DoT server addresses from DoT_ADDRESSES"
  ansible.builtin.template:
    src: "templates/dot_addresses.conf.j2"
    dest: "/etc/systemd/resolved.d/dot-addresses.conf"
    mode: '0644'
    owner: root
    group: root
    backup: true
  notify: Restart systemd-resolved
  tags: dns
  when: common_dot_addresses is defined and common_dot_addresses | length > 0

# Configure DNS-over-HTTPS (DoH) servers
- name: "DNS | Set DoH servers from DNS_OVER_HTTPS_URLS"
  ansible.builtin.lineinfile:
    path: "/etc/systemd/resolved.conf"
    regexp: "^DNSOverHTTPS=UDPWithFallback "
    state: absent
  notify: Restart systemd-resolved
  tags: dns
  when: common_dns_query_over_https | default(false)
  
- name: "DNS | Configure DoH from DNS_OVER_HTTPS_URLS_LIST"
  ansible.builtin.lineinfile:
    path: "/etc/systemd/resolved.conf"
    regexp: "^DNSOverHTTPS=UDPWithFallback "
    line: "DNSOverHTTPS=UDPWithFallback {{ server }}"
    state: present
  notify: Restart systemd-resolved
  tags: dns
  loop: "{{ common_dns_query_over_https_servers | default([]) }}"
  when: common_dns_query_over_https | default(false) | bool

# Configure resolv.conf to use systemd-resolved
- name: "DNS | Configure resolv.conf"
  ansible.builtin.copy:
    content: |
      # Managed by systemd-resolved
      nameserver 127.0.0.53
      options edns0 trust-ad
    dest: "/etc/resolv.conf"
    mode: '0644'
    owner: root
    group: root
    backup: true
    force: false
  notify: Restart systemd-resolved
  tags: dns
  when: common_dns_enabled | default(true)