---
# Параметры подключения (postgres_login_*) по умолчанию смотрят на локальный
# docker-контейнер standalone postgres (см. defaults/main.yml). Для managed
# инстанса эта же таска переиспользуется через tasks/managed_add_db.yml,
# который переопределяет postgres_login_* через vars на include_tasks.
- name: "postgres | Create database user - {{ item.user }}"
  community.postgresql.postgresql_user:
    login_host: "{{ postgres_login_host }}"
    login_port: "{{ postgres_login_port }}"
    login_user: "{{ postgres_login_user }}"
    login_password: "{{ postgres_login_password }}"
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    state: present
  no_log: false

- name: "postgres | Create database - {{ item.db }}"
  community.postgresql.postgresql_db:
    login_host: "{{ postgres_login_host }}"
    login_port: "{{ postgres_login_port }}"
    login_user: "{{ postgres_login_user }}"
    login_password: "{{ postgres_login_password }}"
    name: "{{ item.db }}"
    owner: "{{ item.user }}"
    state: present


- name: "postgres | Grant privileges for db {{ item.db }} and user {{ item.user }}"
  community.postgresql.postgresql_privs:
    login_host: "{{ postgres_login_host }}"
    login_port: "{{ postgres_login_port }}"
    login_user: "{{ postgres_login_user }}"
    login_password: "{{ postgres_login_password }}"
    database: "{{ item.db }}"
    roles: "{{ item.user }}"
    privs: ALL
    type: database
    state: present
